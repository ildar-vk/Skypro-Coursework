[tool.poetry]
name = "courcework"
version = "0.1.0"
description = ""
authors = ["ildar-vk <kalimov.ildar.v@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.3.3"
openpyxl = "^3.1.5"
pytest = "^8.4.2"
python-dotenv = "^1.2.1"
requests = "^2.32.5"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
mypy = "^1.18.2"
black = "^25.9.0"
isort = "^6.1.0"
flake8-black = "^0.4.0"
pandas-stubs = "^2.3.2.250926"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Указываем, что line-length = 119 (стандарт для black) и нужно игнорировать папку venv
line-length = 119
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
  # ... стандартные исключения black
  | venv
  | .venv
)/
'''

[tool.isort]
# Говорим isort использовать настройки, совместимые с black
profile = "black"
multi_line_output = 3
line_length = 119

[tool.flake8]
# Настраиваем flake8, чтобы он не конфликтовал с black
max-line-length = 119
extend-ignore = "E203, W503, E501, F821"
# E203, W503 - конфликтуют с black. E501 (line too long) - за этим следит black.
exclude = [".venv", "venv", "migrations"]

[tool.mypy]
# Базовая конфигурация для mypy
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

